<svg xmlns="http://www.w3.org/2000/svg" width="840" height="254" viewBox="0 0 840 254" role="img" aria-labelledby="title description">
  <title id="title">Givi — Developer profile</title>
  <desc id="description">givi588 ~ $ whoami. Web Development · Python · Game Development. React / TypeScript / Python / Godot. A small amber arcade runner collects four dots.</desc>

  <defs>
    <linearGradient id="surface" x2="1" y2="1">
      <stop stop-color="#151d29"/>
      <stop offset="1" stop-color="#0d141e"/>
    </linearGradient>
    <linearGradient id="rail" x2="1" y2="0">
      <stop stop-color="#445a69" stop-opacity="0"/>
      <stop offset=".18" stop-color="#445a69"/>
      <stop offset=".85" stop-color="#445a69"/>
      <stop offset="1" stop-color="#445a69" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .runner { animation: travel 12s linear infinite; }
    .jaw { transform-origin: 0 0; }
    .upper { animation: open-upper 1.5s ease-in-out infinite; }
    .lower { animation: open-lower 1.5s ease-in-out infinite; }
    .dot-one { animation: first-dot 12s linear infinite; }
    .dot-two { animation: second-dot 12s linear infinite; }
    .dot-three { animation: third-dot 12s linear infinite; }
    .dot-four { animation: fourth-dot 12s linear infinite; }

    @keyframes travel {
      0% { opacity: 0; transform: translateX(0); }
      7% { opacity: 1; }
      61% { opacity: 1; }
      72%, 100% { opacity: 0; transform: translateX(136px); }
    }
    @keyframes open-upper { 0%, 100% { transform: rotate(6deg); } 50% { transform: rotate(-6deg); } }
    @keyframes open-lower { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
    @keyframes first-dot { 0%, 10%, 94%, 100% { opacity: 1; } 13%, 78% { opacity: 0; } }
    @keyframes second-dot { 0%, 25%, 95%, 100% { opacity: 1; } 28%, 79% { opacity: 0; } }
    @keyframes third-dot { 0%, 40%, 96%, 100% { opacity: 1; } 43%, 80% { opacity: 0; } }
    @keyframes fourth-dot { 0%, 55%, 97%, 100% { opacity: 1; } 58%, 81% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .runner, .jaw, .dot { animation: none; }
    }
  </style>

  <rect x="1" y="1" width="838" height="252" rx="18" fill="url(#surface)" stroke="#3a4657" stroke-width="2"/>
  <path d="M19 2H821Q838 2 838 19V39H2V19Q2 2 19 2Z" fill="#1a2331"/>
  <path d="M2 39.5H838" stroke="#343f51"/>
  <g aria-hidden="true">
    <circle cx="25" cy="21" r="4" fill="#ba8589"/>
    <circle cx="39" cy="21" r="4" fill="#c6a675"/>
    <circle cx="53" cy="21" r="4" fill="#7da99c"/>
    <path d="m784 18 4 3-4 3m9 0h8" fill="none" stroke="#8395a7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g class="mono">
    <text x="34" y="81" font-size="24" fill="#bac9d8"><tspan fill="#a6d5bd">givi588</tspan><tspan xml:space="preserve"> ~ $ </tspan><tspan fill="#e3eaf3">whoami</tspan></text>
    <text x="32" y="145" font-size="64" font-weight="700" fill="#f2f5fa">Givi</text>
    <text x="34" y="186" font-size="29" fill="#d0dbe8">Web Development · Python · Game Development</text>
    <path d="M34 201H806" stroke="#344253"/>
    <text x="34" y="232" font-size="24" fill="#a6d5bd">React / TypeScript / Python / Godot</text>
  </g>

  <g transform="translate(626 73)" aria-hidden="true">
    <path d="M-19 0H161" stroke="url(#rail)" stroke-width="2"/>
    <g fill="#a6d5bd">
      <circle class="dot dot-one" cx="27" r="2.7"/>
      <circle class="dot dot-two" cx="55" r="2.7"/>
      <circle class="dot dot-three" cx="83" r="2.7"/>
      <circle class="dot dot-four" cx="111" r="2.7"/>
    </g>
    <g class="runner">
      <path d="M-9.8 0a5 5 0 0 1 5-5H0V5h-4.8a5 5 0 0 1-5-5Z" fill="#d9aa71"/>
      <path class="jaw upper" d="M-10 0C-10-6-5-10 1-10C5-10 8-8 10-5L1 0Z" fill="#e6b978"/>
      <path class="jaw lower" d="M-10 0C-10 6-5 10 1 10C5 10 8 8 10 5L1 0Z" fill="#cd9f67"/>
      <path d="M-3-5h2" stroke="#293043" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
